name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-asset:
    name: Build and upload card bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync version in package.json with release tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Release tag → version: $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > /tmp/package.json
          mv /tmp/package.json package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # HACS downloads the asset matching hacs.json "filename"; attaching it
      # to the release also enables the GitHub downloads counter.
      - name: Upload bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/melitta-barista-card.js
            dist/melitta-barista-card.js.map
